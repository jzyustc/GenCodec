[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-image-codec"
version = "1.0.0"
description = "PULSE: single-thread CPU decoding for practical neural image compression"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.5,<2.11", "numpy>=1.24", "Pillow>=10", "PyYAML>=6", "tqdm>=4.66"]

[project.optional-dependencies]
train = ["torchvision>=0.19", "lpips>=0.1.4", "timm>=1.0"]
deploy = ["onnx>=1.16", "openvino>=2024.4", "ninja>=1.11"]
download = ["huggingface_hub>=0.26"]
metrics = ["torchvision>=0.19", "lpips>=0.1.4", "DISTS-pytorch", "torchmetrics>=1.4", "torch-fidelity>=0.3", "scipy>=1.10"]
teachers = ["facenet-pytorch==2.5.3", "onnx>=1.16", "onnx2torch"]

[project.scripts]
pulse-compress = "compress:main"
pulse-decompress = "decompress:main"
pulse-evaluate = "evaluate:main"
pulse-benchmark-amd = "deployment.cpu_amd_epyc_9v84_single_thread.benchmark:main"
pulse-benchmark-h100 = "deployment.gpu_nvidia_h100.benchmark:main"
pulse-download = "download_models:main"
pulse-train-mse = "train_mse:main"
pulse-train-perceptual = "train_perceptual:main"
pulse-postprocess = "postprocess:main"

[tool.setuptools]
py-modules = ["compress", "decompress", "evaluate", "download_models",
              "train_mse", "train_perceptual", "postprocess"]
