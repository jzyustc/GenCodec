# Full recipe; batch sizes are global across GPUs.
format_version: 1
size: base
objective: perceptual
architecture:
  M: 320
  z_ch: 96
  hidden_size: 144
  hidden_size_x: 48
  hx_bottleneck: 48
  mlp_ratio: 1.8888888888888888
  num_cond_blocks: 2
  entropy_channels: 128
  dico_block_variant: ca
runtime:
  precision: bf16
  seed: 0
  gradient_clip: 1.0
stages:
- name: perceptual_lr
  data: lr
  crop: 512
  batch: 16
  steps: 300000
  lr: 0.001
  milestones:
  - 200000
  lr_gamma: 0.1
  optimizer:
    name: soap
    betas:
    - 0.95
    - 0.95
    shampoo_beta: 0.95
    weight_decay: 0.01
    precondition_frequency: 50
    max_precond_dim: 2048
    merge_dims: true
    data_format: channels_first
  augment:
    random_crop: false
    hflip: false
    crop_from_native: true
  loss:
    lambda_min: 0.5
    lambda_max: 12.5
    mse: 5.0
    mse_alpha: 0.0
    lpips: 1.0
    lpips_alex: 0.5
- name: perceptual_hr
  data: hr
  crop: 1024
  batch: 16
  steps: 50000
  lr: 0.0001
  milestones:
  - 40000
  lr_gamma: 0.1
  optimizer:
    name: soap
    betas:
    - 0.95
    - 0.95
    shampoo_beta: 0.95
    weight_decay: 0.01
    precondition_frequency: 50
    max_precond_dim: 2048
    merge_dims: true
    data_format: channels_first
  augment:
    random_crop: true
    hflip: true
    crop_from_native: true
  loss:
    lambda_min: 0.5
    lambda_max: 12.5
    mse: 5.0
    mse_alpha: 0.0
    lpips: 1.0
    lpips_alex: 0.5
- name: perceptual_roi
  data: roi
  crop: 1024
  batch: 32
  steps: 20000
  lr: 0.0001
  milestones:
  - 10000
  lr_gamma: 0.1
  optimizer:
    name: soap
    betas:
    - 0.95
    - 0.95
    shampoo_beta: 0.95
    weight_decay: 0.0
    precondition_frequency: 50
    max_precond_dim: 2048
    merge_dims: true
    data_format: channels_first
  augment:
    random_crop: true
    hflip: true
    crop_from_native: true
    roi_crop_prob: 0.75
    roi_context_scale: 1.5
    min_mask_side: 8.0
  loss:
    lambda_min: 3.0
    lambda_max: 25.0
    mse: 5.0
    mse_alpha: 0.0
    lpips: 0.25
    lpips_alex: 0.125
    gan: 0.005
    roi: true
    roi_mse: 0.125
    roi_lpips: 0.125
    roi_lpips_patch_size: 128
    face: 0.0125
    text: 0.025
    face_context_scale: 1.5
    ocr_context_scale: 1.1
  disc_step: 2
  disc_optimizer:
    name: adam
    lr: 0.0001
    betas:
    - 0.5
    - 0.9
