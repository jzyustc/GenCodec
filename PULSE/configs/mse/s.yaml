# Full recipe; batch sizes are global across GPUs.
format_version: 1
size: s
objective: mse
architecture:
  M: 256
  z_ch: 80
  hidden_size: 96
  hidden_size_x: 32
  hx_bottleneck: 16
  mlp_ratio: 2.0
  num_cond_blocks: 2
  entropy_channels: 128
  dico_block_variant: plain
runtime:
  precision: bf16
  seed: 0
  gradient_clip: 1.0
stages:
- name: mse_lr
  data: lr
  crop: 512
  batch: 8
  steps: 500000
  lr: 0.001
  milestones:
  - 200000
  - 400000
  lr_gamma: 0.1
  optimizer:
    name: soap
    betas:
    - 0.95
    - 0.95
    shampoo_beta: 0.95
    weight_decay: 0.01
    precondition_frequency: 50
    max_precond_dim: 2048
    merge_dims: true
    data_format: channels_first
  augment:
    random_crop: false
    hflip: false
    crop_from_native: true
  loss:
    lambda_min: 8.0
    lambda_max: 80.0
    mse: 5.0
    mse_alpha: 0.4435
    lpips: 0.0
    lpips_alex: 0.0
- name: mse_hr
  data: hr
  crop: 1024
  batch: 8
  steps: 50000
  lr: 0.0001
  milestones:
  - 40000
  lr_gamma: 0.1
  optimizer:
    name: soap
    betas:
    - 0.95
    - 0.95
    shampoo_beta: 0.95
    weight_decay: 0.01
    precondition_frequency: 50
    max_precond_dim: 2048
    merge_dims: true
    data_format: channels_first
  augment:
    random_crop: true
    hflip: true
    crop_from_native: true
  loss:
    lambda_min: 8.0
    lambda_max: 80.0
    mse: 5.0
    mse_alpha: 0.4435
    lpips: 0.0
    lpips_alex: 0.0
